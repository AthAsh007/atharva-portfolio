# Cloudflare Workers with static assets. The portfolio has no server runtime:
# `bun run build` exports the whole site to `out/`, and `wrangler deploy`
# uploads it as static assets on a Worker that serves them from the edge.
#
# Build command (Cloudflare build settings): bun install && bun run build
# Deploy command: npx wrangler deploy
name = "atharva-portfolio"
compatibility_date = "2025-01-01"

[assets]
directory = "./out"
# serve index.html for unknown paths so hash anchors keep working
not_found_handling = "single-page-application"
